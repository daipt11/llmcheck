[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcheck"
version = "0.1.16"
description = "A CLI tool to check the health of LLM APIs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "litellm>=1.35.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[project.scripts]
llmcheck = "llmcheck.cli:main"
