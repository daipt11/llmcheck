[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcheck"
version = "0.5.0"
description = "A CLI tool to check the health of LLM APIs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "litellm>=1.35.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
llmcheck = "llmcheck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
